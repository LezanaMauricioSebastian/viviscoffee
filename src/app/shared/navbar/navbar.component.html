<nav class="site-nav" [class.is-solid]="isSolid" [class.is-open]="menuOpen">
  <div class="site-nav__inner">
    <button
      type="button"
      class="site-nav__toggle"
      (click)="toggleMenu()"
      [attr.aria-expanded]="menuOpen"
      aria-controls="navMenu"
      aria-label="Abrir menú"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>

    <a class="site-nav__brand" routerLink="/" (click)="closeMenu()">
      <span class="site-nav__brand-name brand-type">Vivi's Coffee</span>
      <span class="site-nav__brand-tag">Café al paso</span>
    </a>

    <div class="site-nav__menu" id="navMenu" [class.is-open]="menuOpen">
      <ul class="site-nav__links">
        <li><a routerLink="/" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }" (click)="closeMenu()">Inicio</a></li>
        <li><a routerLink="/cafe" routerLinkActive="is-active" (click)="closeMenu()">Café</a></li>
        <li><a routerLink="/chocolates" routerLinkActive="is-active" (click)="closeMenu()">Chocolates</a></li>
        <li><a routerLink="/box" routerLinkActive="is-active" (click)="closeMenu()">Box</a></li>
        <li><a routerLink="/cookies" routerLinkActive="is-active" (click)="closeMenu()">Cookies</a></li>
        <li><a routerLink="/salado" routerLinkActive="is-active" (click)="closeMenu()">Salado</a></li>
        <li><a routerLink="/vegan" routerLinkActive="is-active" (click)="closeMenu()">Vegan</a></li>
      </ul>

      <div class="site-nav__auth">
        @if (auth.isLoggedIn()) {
          <a routerLink="/admin" (click)="closeMenu()">Admin</a>
          <button type="button" class="site-nav__ghost" (click)="logout(); closeMenu()">Cerrar sesión</button>
        } @else {
          <a routerLink="/login" class="site-nav__login" (click)="closeMenu()">Iniciar sesión</a>
        }
      </div>
    </div>
  </div>
</nav>
